# Runs on every push to main, on every pull request, and on demand from the
# Actions tab ("Run workflow"): install, typecheck, run the Jest tests, and
# check that the Next.js app builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Melbourne   # same timezone as the app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run next:build
